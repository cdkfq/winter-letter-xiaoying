    <section class="greeting" aria-labelledby="title">
      <p class="dedication" id="dedication">把这个冬天的温柔，送给你</p>
      <h1 id="title"><span>Merry</span><em>Christmas</em></h1>
      <p class="greeting-line" id="greeting-line">愿你所念，皆有回响。</p>
    </section>

    <button class="tree-touch" id="tree-touch" type="button" aria-label="轻触圣诞树散开星光，也可以左右拖动旋转"></button>

    <div class="bottom-area">

      <h2 id="dialog-title">许个小小的愿望</h2>
      <label for="wish-text">你的心愿</label>
      <textarea id="wish-text" name="wish" maxlength="80" rows="3" placeholder="比如，想见的人都在身边……" required></textarea>

    <div class="share-content">
      <button class="icon-button dialog-close" type="button" id="close-share" aria-label="关闭"><svg viewBox="0 0 256 256" aria-hidden="true" focusable="false"><path d="M205.66,194.34a8,8,0,0,1-11.32,11.32L128,139.31,61.66,205.66a8,8,0,0,1-11.32-11.32L116.69,128,50.34,61.66A8,8,0,0,1,61.66,50.34L128,116.69l66.34-66.35a8,8,0,0,1,11.32,11.32L139.31,128Z"/></svg></button>
      <p class="dialog-kicker">把星光送到 TA 手里</p>
      <h2 id="share-title">送出这棵圣诞树</h2>
      <label for="recipient">收件人 <span class="optional">选填</span></label>
      <input id="recipient" maxlength="18" placeholder="写下 TA 的名字">
      <label for="message">祝福 <span class="optional">选填</span></label>
      <input id="message" maxlength="48" placeholder="愿你所念，皆有回响。">
      <button class="wish-button dialog-submit" id="copy-share" type="button"><svg viewBox="0 0 256 256" aria-hidden="true" focusable="false"><path d="M216,32H88a8,8,0,0,0-8,8V80H40a8,8,0,0,0-8,8V216a8,8,0,0,0,8,8H168a8,8,0,0,0,8-8V176h40a8,8,0,0,0,8-8V40A8,8,0,0,0,216,32ZM160,208H48V96H160Zm48-48H176V88a8,8,0,0,0-8-8H96V48H208Z"/></svg><span>复制专属链接</span></button>

      <p class="privacy-note">名字和祝福会随链接一起送出。</p>
    </div>
  </dialog>
